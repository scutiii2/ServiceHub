<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ServiceHub</title>
<style>
  :root {
    color-scheme: light;
    --bg:#f5f7fb; --surface:#fff; --sunk:#f1f3f8; --line:#e3e7ef; --line-strong:#d5d9e0;
    --chart:#5871dc; --chart-low:#aab8ee;
    --text:#171a21; --mute:#5b6475; --accent:#3451d1; --on-accent:#fff; --accent-soft:#eef1fd;
    --up:#1a7f4b; --down:#c23a3a; --idle:#a3abba;
    --warn-bg:#fff6e5; --warn-line:#f0d9a8; --warn-text:#6b4200;
    --pop:0 12px 32px -8px rgb(23 26 33 / .18), 0 2px 6px rgb(23 26 33 / .06);
    --ease:cubic-bezier(.16,1,.3,1);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme:dark;
    --bg:#0f1115; --surface:#15181e; --sunk:#1b1f27; --line:#262b35; --line-strong:#343a47;
    --text:#e8eaee; --mute:#98a1b0; --accent:#8da2ff; --on-accent:#0c1230; --accent-soft:#1c2340;
    --up:#4cc38a; --down:#f07878; --idle:#5d6677; --chart:#8da2ff; --chart-low:#566aaa;
    --warn-bg:#2a2214; --warn-line:#4a3a1a; --warn-text:#f0cf8e; --pop:0 12px 32px -8px rgb(0 0 0 / .6); } }
  :root[data-theme="dark"] { color-scheme:dark;
    --bg:#0f1115; --surface:#15181e; --sunk:#1b1f27; --line:#262b35; --line-strong:#343a47;
    --text:#e8eaee; --mute:#98a1b0; --accent:#8da2ff; --on-accent:#0c1230; --accent-soft:#1c2340;
    --up:#4cc38a; --down:#f07878; --idle:#5d6677; --chart:#8da2ff; --chart-low:#566aaa;
    --warn-bg:#2a2214; --warn-line:#4a3a1a; --warn-text:#f0cf8e; --pop:0 12px 32px -8px rgb(0 0 0 / .6); }

  * { box-sizing:border-box }
  [hidden] { display:none !important }
  html,body { height:100% }
  body { margin:0; display:flex; font:14px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased }
  ::selection { background:var(--accent); color:var(--on-accent) }
  * { scrollbar-width:thin; scrollbar-color:var(--line-strong) transparent }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:6px }
  button,input { font:inherit; color:inherit }
  button { cursor:pointer }
  svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; flex:none }

  /* rail */
  aside { width:238px; flex:none; background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:23px 15px 18px; gap:20px; z-index:5 }
  .brand { display:flex; align-items:center; gap:10px; padding:0 4px; font-weight:700; font-size:17px; letter-spacing:-.025em }
  .brand i { width:33px; height:33px; border-radius:9px; background:var(--accent); display:grid; place-items:center; color:var(--on-accent) }
  .brand i svg { width:18px; height:18px; stroke-width:1.6 }
  .brand .theme { margin-left:auto }
  .nav { display:grid; gap:5px; padding-bottom:15px; border-bottom:1px solid var(--line) }
  .nav button { display:flex; align-items:center; gap:9px; padding:9px; border:0; background:none; border-radius:8px; color:var(--mute); text-align:left }
  .nav #navAdd { background:var(--sunk); color:var(--text); font-weight:600 }
  .nav button:hover { background:var(--sunk); color:var(--text) }
  .nav button.on { background:var(--accent-soft); color:var(--accent) }
  .group { display:flex; justify-content:space-between; font-size:12px; font-weight:600; color:var(--mute); padding:0 9px; margin:0 0 -10px }
  #list { flex:1; overflow:auto; display:grid; gap:2px; align-content:start; margin:0 -4px; padding:0 4px }
  .item { display:grid; grid-template-columns:8px minmax(0,1fr) auto; align-items:center; gap:9px; padding:9px; min-height:49px; border-radius:8px; border:0; background:none; text-align:left; width:100% }
  .item:hover { background:var(--sunk) }
  .item.sel { background:var(--accent-soft) }
  .item.sel .name { color:var(--accent); font-weight:600 }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--idle); flex:none }
  .dot.up { background:var(--up) }
  .dot.down { background:var(--down) }
  .dot.part { background:#c98219 }
  .name { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; font-weight:560 }
  .item small { display:block; color:var(--mute); font-size:11px }
  .tag { font-size:11px; color:var(--mute); flex:none }
  .foot { display:flex; gap:9px; align-items:center; border-top:1px solid var(--line); padding:14px 5px 0; font-size:12px; color:var(--mute) }

  .icon-btn { width:30px; height:30px; display:grid; place-items:center; border:0; background:none; border-radius:8px; color:var(--mute) }
  .icon-btn:hover { background:var(--sunk); color:var(--text) }

  /* main */
  main { flex:1; min-width:0; display:flex; flex-direction:column }
  .bar { display:flex; align-items:center; gap:15px; padding:20px 28px; min-height:84px }
  .bar .menu { display:none }
  .ident { min-width:0; display:grid }
  .ident h1 { margin:0; font-size:21px; font-weight:690; letter-spacing:-.026em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .ident span { font-size:12px; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .pips { display:flex; align-items:center; gap:8px; padding:5px 11px; background:var(--sunk); border-radius:99px; font-size:12px; color:var(--mute); flex:none }
  .pips b { display:flex; gap:4px }
  .pips b i { width:8px; height:8px; border-radius:3px; background:var(--idle) }
  .pips b i.up { background:var(--up) } .pips b i.down { background:var(--down) } .pips b i.part { background:#d9951a }
  .spacer { flex:1 }
  .acts { display:flex; align-items:center; gap:6px }
  .btn { display:inline-flex; align-items:center; gap:7px; padding:6px 12px; border:1px solid var(--line-strong); background:var(--surface); border-radius:8px; transition:background .15s, border-color .15s }
  .btn:hover { background:var(--sunk) }
  .btn:disabled { opacity:.5; cursor:default }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent) }
  .btn.primary:hover { background:color-mix(in srgb,var(--accent) 88%,var(--text)) }
  .btn.danger:hover { color:var(--down); border-color:color-mix(in srgb,var(--down) 40%,var(--line-strong)) }
  .btn.quiet { border-color:transparent; background:none; color:var(--mute) }
  .btn.quiet:hover { background:var(--sunk); color:var(--text) }

  .warn { margin:0 28px 16px; padding:12px 14px; border:1px solid var(--warn-line); background:var(--warn-bg); color:var(--warn-text); border-radius:10px; display:flex; gap:10px; align-items:flex-start; font-size:13px }
  .warn p { margin:0; flex:1 }
  .warn button { border:0; background:none; color:inherit; padding:2px; border-radius:6px; opacity:.75 }
  .warn button:hover { opacity:1 }

  .stage { flex:1; min-height:0; margin:0 28px 28px; border:1px solid var(--line); border-radius:14px; background:var(--surface); overflow:auto; display:flex; flex-direction:column }
  .stage.down { align-items:center; justify-content:center; text-align:center; gap:6px; color:var(--mute); background:var(--bg); border-style:dashed }
  .stage.down h2 { margin:0; font-size:16px; color:var(--text); font-weight:600 }
  .stage.down p { margin:0 0 12px }
  #stageContent { display:contents }
  .stage:is(:fullscreen,.expanded) { width:100%; height:100%; margin:0; border:0; border-radius:0; overflow:auto }
  .stage.expanded { position:fixed; inset:0; z-index:10 }
  body:has(.stage.expanded) { overflow:hidden }
  body:has(.stage.expanded) > aside,
  body:has(.stage.expanded) main > :not(.stage) { visibility:hidden }
  .fullscreen-bar { position:sticky; top:0; z-index:1; display:flex; justify-content:end; align-self:stretch; padding:8px 16px; background:var(--surface); border-bottom:1px solid var(--line) }
  .stage.down .fullscreen-bar { position:absolute; inset:0 0 auto }

  /* synthetic embedded admin page: deliberately its own style, as a real service would be */
  .frame-bar { display:flex; align-items:center; gap:8px; padding:12px 18px; border-bottom:1px solid var(--line); background:var(--sunk); color:var(--mute); font-size:12px }
  .frame-bar small { margin-left:auto; color:inherit; font-size:inherit }
  .embed { padding:25px 28px 28px }
  .embed h2 { font-size:28px; line-height:1.2; letter-spacing:-.032em; margin:0 0 5px }
  .embed h3 { font-size:15px; margin:0; letter-spacing:-.014em }
  .embed p { margin:0; color:var(--mute) }
  .embed > p { margin-bottom:20px }
  .metrics { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); border-block:1px solid var(--line); margin:22px 0 24px; padding:17px 0 }
  .metric { padding:0 20px; border-left:1px solid var(--line) }
  .metric:first-child { padding-left:0; border:0 }
  .metric b { display:block; font-size:26px; letter-spacing:-.03em; font-weight:665 }
  .metric span { font-size:12px; color:var(--mute) }
  .console-grid { display:grid; grid-template-columns:minmax(0,1.65fr) minmax(205px,1fr); gap:27px }
  .panel-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:13px }
  .panel-head span { color:var(--mute); font-size:12px }
  .chart { margin:0; display:grid; grid-template-columns:27px 1fr; gap:5px 8px; color:var(--mute); font-size:11px }
  .chart-scale { display:flex; flex-direction:column; justify-content:space-between; text-align:right; margin-block:-7px }
  .chart-plot { height:139px; position:relative; isolation:isolate }
  .chart-lines, .chart-bars { position:absolute; inset:0; display:flex }
  .chart-lines { flex-direction:column; justify-content:space-between }
  .chart-lines i { border-bottom:1px solid var(--line) }
  .chart-bars { align-items:end; gap:clamp(3px, .72vw, 11px); padding:0 5px 1px }
  .chart-bars i { width:100%; height:var(--height); background:var(--chart-low); border-radius:3px 3px 0 0 }
  .chart-bars i:last-child { background:var(--chart) }
  .chart-time { grid-column:2; display:flex; justify-content:space-between }
  .config { margin:0 }
  .config div { display:flex; justify-content:space-between; align-items:baseline; gap:12px; border-top:1px solid var(--line); padding:9px 0 }
  .config dt { color:var(--mute); font-size:12px }
  .config dd { margin:0; text-align:right; overflow-wrap:anywhere; font-size:13px; font-weight:600 }
  .containers { margin-top:25px }
  .containers table { width:100%; border-collapse:collapse; table-layout:fixed; font-size:13px }
  .containers th, .containers td { text-align:left; border-top:1px solid var(--line); padding:9px 0; overflow-wrap:anywhere }
  .containers th { color:var(--mute); font-weight:500; font-size:12px }
  .containers th + th { width:104px }
  .containers code { font-size:12px }
  .container-state { display:flex; align-items:center; gap:8px; padding-left:4px }
  body[data-detached] aside, body[data-detached] .bar { display:none }
  body[data-detached] .stage { margin-top:28px }

  /* discover */
  .page { flex:1; overflow:auto; padding:6px 24px 28px 28px }
  .page-in { max-width:780px }
  .page h1 { margin:6px 0 4px; font-size:21px; letter-spacing:-.02em }
  .page > .page-in > p { margin:0 0 22px; color:var(--mute); max-width:62ch }
  .tools { display:flex; align-items:center; gap:14px; margin-bottom:6px }
  .check { display:flex; align-items:center; gap:9px; color:var(--mute); cursor:pointer }
  .check input { accent-color:var(--accent); width:16px; height:16px; margin:0 }
  .rows { border-top:1px solid var(--line) }
  .row { display:flex; align-items:center; gap:14px; padding:14px 2px; border-bottom:1px solid var(--line) }
  .row .grow { flex:1; min-width:0 }
  .row .grow div { font-weight:550 }
  .row .grow small { color:var(--mute); display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .added { color:var(--mute); display:inline-flex; align-items:center; gap:6px; padding:6px 12px }

  /* drawer */
  dialog.drawer { inset:0 0 0 auto; margin:0; max-width:none; max-height:none; width:min(420px,100%); height:100%; border:0; border-left:1px solid var(--line); border-radius:0; padding:24px; animation:slide .22s var(--ease) }
  .drawer[open] { display:flex; flex-direction:column; gap:18px }
  .drawer h2 { margin:0; font-size:17px }
  .drawer form { display:grid; gap:16px }
  .field { display:grid; gap:6px } .field label { font-size:12px; color:var(--mute) }
  .field input[type=text], .field input[type=url] { margin:0; padding:9px 11px; border:1px solid var(--line-strong); border-radius:8px; background:var(--bg) }
  .field input:focus-visible { outline-offset:0; border-color:var(--accent) }
  .field small { color:var(--mute) }
  .drawer .end { display:flex; gap:8px; margin-top:auto; justify-content:flex-end }

  dialog { border:1px solid var(--line); border-radius:14px; padding:22px; background:var(--surface); color:var(--text); width:min(340px,calc(100% - 32px)); box-shadow:var(--pop) }
  dialog::backdrop { background:rgb(15 17 21 / .32) }
  dialog h2 { margin:0 0 4px; font-size:16px } dialog p { margin:0 0 16px; color:var(--mute) }
  dialog input { width:100%; padding:9px 11px; border:1px solid var(--line-strong); border-radius:8px; background:var(--bg); margin-bottom:16px }
  dialog .end { display:flex; gap:8px; justify-content:flex-end }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:9px 16px; border-radius:10px; z-index:30; animation:fade .25s var(--ease) }

  @keyframes fade { from { opacity:0 } }
  @keyframes slide { from { transform:translateX(24px); opacity:0 } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important } }

  @media (max-width:860px) {
    aside { position:fixed; inset:0 auto 0 0; visibility:hidden; transform:translateX(-100%); transition:transform .25s var(--ease),visibility .25s; box-shadow:var(--pop) }
    aside.open { visibility:visible; transform:none }
    .bar { padding:12px 16px } .bar .menu { display:grid }
    .warn { margin:0 16px 10px } .stage { margin:0 16px 16px } .page { padding:4px 16px 24px }
  }
  @media (max-width:680px) { .console-grid { grid-template-columns:1fr; gap:23px } }
  @media (max-width:560px) {
    .bar { flex-wrap:wrap; row-gap:9px }
    .ident { flex:1 }
    .bar .spacer { display:none }
    .acts { order:3; width:100%; padding-left:4px }
    .pips { font-size:0; padding:7px 9px }
    .pips span { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%) }
    .embed { padding:18px 15px }
    .embed h2 { font-size:23px }
    .metric { padding:0 8px }
    .metric b { font-size:20px }
    .metric span { font-size:11px }
    .frame-bar { padding-inline:12px }
    body { min-height:100%; height:auto }
    main { min-height:100dvh }
    .stage { overflow:visible }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></symbol>
  <symbol id="i-scan" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></symbol>
  <symbol id="i-ext" viewBox="0 0 16 16"><path d="M9 3h4v4M13 3 7.5 8.5M11 9.5V12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h2.5"/></symbol>
  <symbol id="i-edit" viewBox="0 0 16 16"><path d="m10.5 3.5 2 2L5 13H3v-2z"/></symbol>
  <symbol id="i-x" viewBox="0 0 16 16"><path d="m4 4 8 8M12 4l-8 8"/></symbol>
  <symbol id="i-play" viewBox="0 0 16 16"><path d="M5 3.5v9l7-4.5z"/></symbol>
  <symbol id="i-stop" viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="1.5"/></symbol>
  <symbol id="i-restart" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.5v2.8h-2.8"/></symbol>
  <symbol id="i-check" viewBox="0 0 16 16"><path d="m3.5 8.5 3 3 6-6.5"/></symbol>
  <symbol id="i-menu" viewBox="0 0 16 16"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/></symbol>
  <symbol id="i-theme" viewBox="0 0 16 16"><path d="M13 9.5A5.5 5.5 0 0 1 6.5 3a5.5 5.5 0 1 0 6.5 6.5z"/></symbol>
  <symbol id="i-alert" viewBox="0 0 16 16"><path d="M8 2.5 14 13H2zM8 6.5v3M8 11.2v.1"/></symbol>
  <symbol id="i-hub" viewBox="0 0 16 16"><circle cx="8" cy="8" r="1.8"/><circle cx="3" cy="4" r="1.2"/><circle cx="13" cy="4" r="1.2"/><circle cx="8" cy="13.5" r="1.2"/><path d="m4 4.8 2.7 2M12 4.8 9.3 6.8M8 9.8v2.5"/></symbol>
  <symbol id="i-frame" viewBox="0 0 16 16"><rect x="2.5" y="3" width="11" height="10" rx="1.5"/><path d="M2.5 6.3h11m-8.5 3h2"/></symbol>
  <symbol id="i-expand" viewBox="0 0 16 16"><path d="M6 3H3v3m7-3h3v3M3 10v3h3m7-3v3h-3"/></symbol>
  <symbol id="i-collapse" viewBox="0 0 16 16"><path d="M3 6h3V3m7 3h-3V3M6 13v-3H3m7 3v-3h3"/></symbol>
</defs></svg>

<aside id="rail" aria-label="Services">
  <div class="brand"><i><svg><use href="#i-hub"/></svg></i>ServiceHub
    <button class="icon-btn theme" id="theme" title="Toggle dark mode" aria-label="Toggle dark mode"><svg><use href="#i-theme"/></svg></button></div>
  <nav class="nav">
    <button id="navAdd"><svg><use href="#i-plus"/></svg>Add service</button>
    <button id="navDisc"><svg><use href="#i-scan"/></svg>Discover on this host</button>
  </nav>
  <div class="group">Services <span id="serviceCount"></span></div>
  <div id="list"></div>
  <div class="foot"><svg aria-hidden="true"><use href="#i-hub"/></svg>Preview · synthetic data</div>
</aside>

<main>
  <div class="bar">
    <button class="icon-btn menu" id="menu" aria-label="Open services" aria-controls="rail" aria-expanded="false"><svg><use href="#i-menu"/></svg></button>
    <div class="ident"><h1 id="title" tabindex="-1">ServiceHub</h1><span id="sub"></span></div>
    <div class="pips" id="pips" hidden><b id="pipDots"></b><span id="pipText"></span></div>
    <div class="spacer"></div>
    <div class="acts" id="acts" hidden>
      <button class="btn primary" data-act="start"><svg><use href="#i-play"/></svg><span>Start</span></button>
      <button class="btn danger" data-act="stop"><svg><use href="#i-stop"/></svg><span>Stop</span></button>
      <button class="btn" data-act="restart"><svg><use href="#i-restart"/></svg><span>Restart</span></button>
      <button class="icon-btn" id="edit" title="Edit service" aria-label="Edit service"><svg><use href="#i-edit"/></svg></button>
      <button class="icon-btn" type="button" id="enterFullscreen" title="Enter fullscreen" aria-label="Enter fullscreen" aria-controls="stage"><svg aria-hidden="true"><use href="#i-expand"/></svg></button>
      <a class="icon-btn" id="pop" title="Open preview in new tab" aria-label="Open preview in new tab" target="_blank" rel="noopener" style="text-decoration:none"><svg><use href="#i-ext"/></svg></a>
    </div>
  </div>
  <div class="warn" id="warn" role="alert" hidden>
    <svg style="margin-top:2px"><use href="#i-alert"/></svg>
    <div style="flex:1"><p id="warnText"></p></div>
    <button id="warnClose" aria-label="Close warning"><svg><use href="#i-x"/></svg></button>
  </div>
  <div class="stage" id="stage">
    <div class="fullscreen-bar" id="fullscreenBar" hidden>
      <button class="btn" type="button" id="exitFullscreen"><svg aria-hidden="true"><use href="#i-collapse"/></svg>Exit fullscreen</button>
    </div>
    <div id="stageContent"></div>
  </div>
  <div class="page" id="discover" hidden>
    <div class="page-in">
      <h1>Discover on this host</h1>
      <p>Docker containers publishing a port on this machine. Add puts one in your list; nothing is changed on the container.</p>
      <div class="tools">
        <label class="check"><input type="checkbox" id="onlyHttp" checked> Only services that answer /health</label>
        <span class="spacer"></span>
        <button class="btn" id="rescan"><svg><use href="#i-restart"/></svg>Rescan</button>
      </div>
      <div class="rows" id="found"></div>
    </div>
  </div>
</main>

<dialog id="pw">
  <form method="dialog" id="pwForm">
    <h2>Admin password</h2>
    <p id="pwText"></p>
    <input type="password" id="pwInput" autocomplete="off" aria-label="Admin password" required>
    <div class="end"><button class="btn quiet" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="ok">Confirm</button></div>
  </form>
</dialog>

<script>
const $ = s => document.querySelector(s);
const ICON = n => `<svg aria-hidden="true"><use href="#i-${n}"/></svg>`;
const escapeText = value => String(value).replace(/[&<>"']/g, char => (
  {'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[char]
));
// All values below are synthetic.
const SERVICES = [
  {id:'a', name:'MiniCPM 5.2B', url:'http://host.docker.internal:29200', kind:'compose', project:'cnv_minicpm52b_model', members:[['cnv_minicpm52b_model_lb','up'],['cnv_minicpm52b_model_api_1','up'],['cnv_minicpm52b_model_ollama_1','up']]},
  {id:'b', name:'Piper TTS', url:'http://host.docker.internal:29320', kind:'container', members:[['tts_piper_model','up']]},
  {id:'c', name:'Whisper STT', url:'http://host.docker.internal:29300', kind:'container', members:[['stt_whisper_model','up']]},
  {id:'d', name:'Tesseract OCR', url:'http://host.docker.internal:29260', kind:'container', members:[['ocr_tesseract_model','up']]},
  {id:'e', name:'SGLang OCR', url:'http://host.docker.internal:29261', kind:'compose', project:'ocr_sglang_model', members:[['ocr_sglang_model_lb','up'],['ocr_sglang_model_api_1','down'],['ocr_sglang_model_api_2','up']]},
  {id:'f', name:'Laya', url:'http://host.docker.internal:29220', kind:'container', members:[['dsc_laya_model','down']]},
];
const FOUND = [
  {name:'IMG TEM', url:'http://host.docker.internal:29240', kind:'container', state:'running', healthy:true, added:false},
  {name:'TTS Kitten2', url:'http://host.docker.internal:29321', kind:'container', state:'running', healthy:true, added:false},
  {name:'CNV LFM3', url:'http://host.docker.internal:29201', kind:'compose', state:'running', healthy:true, n:3, added:false},
  {name:'redis', url:'http://host.docker.internal:6379', kind:'container', state:'running', healthy:false, added:false},
  {name:'MiniCPM 5.2B', url:'http://host.docker.internal:29200', kind:'compose', state:'running', healthy:true, n:3, added:true},
  {name:'Piper TTS', url:'http://host.docker.internal:29320', kind:'container', state:'running', healthy:true, added:true},
];
let selected = null, view = 'service', pending = null, nextServiceId = 1;
const health = s => { const u = s.members.filter(m => m[1] === 'up').length; return !s.members.length ? 'idle' : u === s.members.length ? 'up' : u === 0 ? 'down' : 'part'; };
const word = h => ({up:'Running', down:'Stopped', part:'Degraded', idle:'Unchecked'}[h]);
const toast = t => { const e = document.createElement('div'); e.className = 'toast'; e.setAttribute('role', 'status'); e.textContent = t; document.body.append(e); setTimeout(() => e.remove(), 2200); };

const hourlyRequests = [14,8,7,12,15,23,48,58,79,110,89,70,66,88,101,86,92,73,59,43,55,41,32,18];
const number = new Intl.NumberFormat('en-US');
const previewId = new URL(location.href).searchParams.get('preview');
const isDetached = () => SERVICES.some(s => s.id === previewId);
const previewUrl = id => '?preview=' + encodeURIComponent(id);

function setRail(open) {
  $('#rail').classList.toggle('open', open);
  $('#menu').setAttribute('aria-expanded', String(open));
  $('#menu').setAttribute('aria-label', open ? 'Close services' : 'Open services');
}

function renderList() {
  $('#list').innerHTML = '';
  $('#serviceCount').textContent = SERVICES.length;
  for (const s of SERVICES) {
    const b = document.createElement('button');
    const current = view === 'service' && s.id === selected;
    b.className = current ? 'item sel' : 'item';
    if (current) b.setAttribute('aria-current', 'true');
    b.innerHTML = `<span class="dot ${health(s)}" aria-hidden="true"></span><span><span class="name"></span><small>${word(health(s))}</small></span><span class="tag">${s.kind}</span>`;
    b.querySelector('.name').textContent = s.name;
    b.onclick = () => { select(s.id); setRail(false); $('#title').focus(); };
    $('#list').append(b);
  }
  $('#navDisc').classList.toggle('on', view === 'discover');
}

function embed(s) {
  const h = health(s);
  const name = escapeText(s.name);
  if (h === 'down') return `<h2>${name} is stopped</h2><p>Nothing is answering on ${escapeText(new URL(s.url).host)}.</p><button class="btn primary" data-act="start">${ICON('play')}Start ${s.kind === 'compose' ? 'project' : 'container'}</button>`;

  const frameLabel = {proxy:'Proxied preview', direct:'Direct preview', new_tab:'New tab'}[s.mode ?? 'proxy'];
  const frame = `<div class="frame-bar">${ICON('frame')} Service admin <small>${frameLabel}</small></div>`;
  const config = s.id === 'a'
    ? [['Model', s.name], ['Max tokens', '2,048'], ['Idle unload', '10 min'], ['Concurrency', '2']]
    : [['Service', s.name], ['Admin path', s.path ?? '/admin/'], ['Access mode', frameLabel]];
  const containers = s.members.map(([member, state]) => `<tr><td><code>${escapeText(member)}</code></td>
    <td><span class="container-state"><i class="dot ${state}" aria-hidden="true"></i>${word(state)}</span></td></tr>`).join('');
  const title = `<h2>${name} admin</h2><p>Service overview</p>`;

  if (s.mode === 'new_tab' && !isDetached()) {
    return `${frame}<div class="embed">
      <h2>${name} admin</h2><p>This service opens in a separate tab.</p>
      <p style="margin-top:16px"><a class="btn primary" href="${previewUrl(s.id)}" target="_blank" rel="noopener">${ICON('ext')}Open preview in new tab</a></p>
    </div>`;
  }
  return `${frame}<div class="embed">${title}
    ${s.id === 'a' ? activity() : ''}
    <div class="console-grid">
      ${s.id === 'a' ? requestChart() : ''}
      <section aria-labelledby="configTitle"><div class="panel-head"><h3 id="configTitle">Configuration</h3></div>
        <dl class="config">${config.map(([label, value]) => `<div><dt>${label}</dt><dd>${escapeText(value)}</dd></div>`).join('')}</dl>
      </section>
    </div>
    ${containers ? `<section class="containers" aria-labelledby="containerTitle">
      <div class="panel-head"><h3 id="containerTitle">${s.kind === 'compose' ? 'Compose containers' : 'Container'}</h3><span>${s.members.filter(([, state]) => state === 'up').length} of ${s.members.length} running</span></div>
      <table><thead><tr><th scope="col">Container name</th><th scope="col">Status</th></tr></thead><tbody>${containers}</tbody></table>
    </section>` : ''}
  </div>`;
}

function activity() {
  const total = number.format(hourlyRequests.reduce((sum, count) => sum + count, 0));
  return `<div class="metrics">
    <div class="metric"><b>${total}</b><span>Requests in sample day</span></div>
    <div class="metric"><b>412 ms</b><span>Median latency</span></div>
    <div class="metric"><b>3.2 GB</b><span>Memory in use</span></div>
  </div>`;
}

function requestChart() {
  const bars = hourlyRequests.map((count, hour) =>
    `<i style="--height:${count / 120 * 100}%" title="${String(hour).padStart(2, '0')}:00 · ${count} requests"></i>`).join('');
  return `<section aria-labelledby="chartTitle">
    <div class="panel-head"><h3 id="chartTitle">Request volume</h3><span>Requests per hour</span></div>
    <figure class="chart" role="img" aria-label="Sample requests by hour, peaking at 110 at 09:00">
      <div class="chart-scale" aria-hidden="true"><span>120</span><span>80</span><span>40</span><span>0</span></div>
      <div class="chart-plot" aria-hidden="true"><div class="chart-lines"><i></i><i></i><i></i><i></i></div><div class="chart-bars">${bars}</div></div>
      <div class="chart-time" aria-hidden="true"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div>
    </figure>
  </section>`;
}

function select(id) {
  selected = id; view = 'service';
  const s = SERVICES.find(x => x.id === id), h = health(s);
  $('#discover').hidden = true;
  $('#title').textContent = s.name; $('#sub').textContent = s.url.replace('http://', '');
  $('#acts').hidden = isDetached();
  $('#pips').hidden = s.members.length === 0;
  $('#pipDots').innerHTML = s.members.map(m => `<i class="${m[1]}" title="${escapeText(m[0])}: ${word(m[1])}"></i>`).join('');
  $('#pipText').textContent = s.kind === 'compose' ? `${word(h)} · ${s.members.filter(m => m[1]==='up').length}/${s.members.length} containers` : word(h);
  for (const b of $('#acts').querySelectorAll('[data-act]')) {
    const a = b.dataset.act; b.hidden = h === 'idle' || (a === 'start' && h === 'up') || (a !== 'start' && h === 'down');
  }
  $('#pop').hidden = !/^[a-f]$/.test(s.id);
  $('#pop').href = previewUrl(s.id);
  $('#stage').classList.toggle('down', h === 'down');
  $('#stageContent').innerHTML = embed(s);
  $('#stage').hidden = false;
  showWarn(s); renderList();
}
function showWarn(s) {
  const scope = s.kind === 'compose' ? `all ${s.members.length} containers in ${s.project}` : s.members[0]?.[0];
  $('#warnText').innerHTML = `<strong>Docker controls</strong> · Start, Stop and Restart affect ${escapeText(scope ?? s.name)}.`;
  $('#warn').hidden = isDetached() || s.members.length === 0;
}
$('#warnClose').onclick = () => $('#warn').hidden = true;

const serviceStage = $('#stage');

function syncFullscreen() {
  const active = document.fullscreenElement === serviceStage || serviceStage.classList.contains('expanded');
  const bar = $('#fullscreenBar');
  if (bar.hidden === !active) return;
  bar.hidden = !active;
  $(active ? '#exitFullscreen' : '#enterFullscreen').focus();
}

$('#enterFullscreen').onclick = async () => {
  if (document.fullscreenEnabled && serviceStage.requestFullscreen) {
    try {
      await serviceStage.requestFullscreen();
      return;
    } catch {
      // Embedded previews can deny native fullscreen. Fill their viewport instead.
    }
  }
  serviceStage.classList.add('expanded');
  syncFullscreen();
};

$('#exitFullscreen').onclick = async () => {
  if (document.fullscreenElement === serviceStage) {
    await document.exitFullscreen();
  } else {
    serviceStage.classList.remove('expanded');
    syncFullscreen();
  }
};

document.addEventListener('fullscreenchange', syncFullscreen);
serviceStage.addEventListener('keydown', event => {
  if (event.key === 'Escape' && serviceStage.classList.contains('expanded') && !$('#pw').open) {
    serviceStage.classList.remove('expanded');
    syncFullscreen();
  }
});

function openDiscover() {
  view = 'discover'; selected = null;
  $('#title').textContent = 'Discover'; $('#sub').textContent = 'Same Docker host';
  $('#acts').hidden = $('#pips').hidden = $('#warn').hidden = true;
  $('#stage').hidden = true; $('#discover').hidden = false;
  scan(); renderList(); setRail(false);
  $('#title').focus();
}
function scan() {
  const only = $('#onlyHttp').checked, rows = FOUND.filter(r => !only || r.healthy || r.added);
  $('#found').innerHTML = rows.length ? '' : '<div class="row"><div class="grow" style="color:var(--mute)">Nothing found. Untick the filter to see every published port.</div></div>';
  for (const r of rows) {
    const d = document.createElement('div'); d.className = 'row';
    d.innerHTML = `<span class="dot ${r.healthy ? 'up' : ''}"></span><div class="grow"><div></div><small>${r.url.replace('http://','')} · ${r.state}${r.kind === 'compose' ? ' · ' + r.n + ' containers' : ''}</small></div><span class="tag">${r.kind}</span>`;
    d.querySelector('.grow div').textContent = r.name;
    const b = document.createElement(r.added ? 'span' : 'button');
    if (r.added) { b.className = 'added'; b.innerHTML = ICON('check') + 'Added'; }
    else {
      b.className = 'btn primary'; b.innerHTML = ICON('plus') + 'Add';
      b.setAttribute('aria-label', 'Add ' + r.name);
      b.onclick = () => {
        r.added = true;
        const project = r.name.toLowerCase().replace(/\W+/g, '_');
        const members = Array.from({length:r.n ?? 1}, (_, index) => [
          r.n ? `${project}_${index + 1}` : project, r.state === 'running' ? 'up' : 'down'
        ]);
        SERVICES.push({id:'n' + nextServiceId++, name:r.name, url:r.url, kind:r.kind, project, members});
        toast(r.name + ' added'); scan(); renderList();
      };
    }
    d.append(b); $('#found').append(d);
  }
}
$('#onlyHttp').onchange = scan; $('#rescan').onclick = () => { toast(`Checked ${FOUND.length} sample entries`); scan(); };
$('#navDisc').onclick = openDiscover;

// add / edit drawer
function drawer(s) {
  const w = document.createElement('dialog');
  w.className = 'drawer';
  w.setAttribute('aria-labelledby', 'drawerTitle');
  w.innerHTML = `<h2 id="drawerTitle">${s ? 'Edit service' : 'Add service'}</h2>
    <form id="serviceForm">
      <div class="field"><label for="n">Name</label><input id="n" name="name" type="text" required autofocus value="${escapeText(s?.name ?? '')}"></div>
      <div class="field"><label for="u">Base URL</label><input id="u" name="url" type="url" pattern="https?://.+" required value="${escapeText(s?.url ?? '')}"><small>Enter an HTTP or HTTPS URL reachable from the hub.</small></div>
      <div class="field"><label for="p">Admin path</label><input id="p" name="path" type="text" pattern="/.*" value="${escapeText(s?.path ?? '/admin/')}"></div>
      <label class="check"><input name="direct" type="checkbox" ${s?.mode === 'direct' ? 'checked' : ''}> Open directly</label>
    </form>
    <div class="end"><button class="btn quiet" id="dc">Cancel</button><button class="btn primary" type="submit" form="serviceForm">${s ? 'Save changes' : 'Add service'}</button></div>`;
  document.body.append(w);
  w.querySelector('#dc').onclick = () => w.close();
  w.addEventListener('close', () => w.remove(), {once:true});
  w.querySelector('form').addEventListener('submit', event => {
    event.preventDefault();
    const values = new FormData(event.currentTarget);
    const name = values.get('name').trim();
    if (!name) { w.querySelector('#n').value = ''; w.querySelector('#n').reportValidity(); return; }
    const service = s ?? {id:'n' + nextServiceId++, kind:'Manual', members:[]};
    Object.assign(service, {
      name, url:values.get('url'), path:values.get('path').trim() || '/admin/',
      mode:values.has('direct') ? 'direct' : 'proxy'
    });
    if (!s) SERVICES.push(service);
    w.close();
    select(service.id);
    $('#title').focus();
    toast(s ? 'Changes saved in preview' : 'Service added to preview');
  });
  w.showModal();
}
$('#navAdd').onclick = () => { setRail(false); drawer(null); };
$('#edit').onclick = () => drawer(SERVICES.find(x => x.id === selected));

// control actions: the password is the only gate
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || !selected) return;
  const s = SERVICES.find(x => x.id === selected), act = b.dataset.act;
  pending = act;
  $('#pwText').textContent = `${act[0].toUpperCase() + act.slice(1)} ${s.kind === 'compose' ? s.members.length + ' containers in ' + s.project : s.members[0][0]}. Mockup password: any text.`;
  $('#pwInput').value = ''; $('#pw').returnValue = ''; $('#pw').showModal();
});
$('#pw').addEventListener('close', () => {
  if ($('#pw').returnValue !== 'ok') return;
  const s = SERVICES.find(x => x.id === selected);
  s.members.forEach(m => m[1] = pending === 'stop' ? 'down' : 'up');
  toast(`${s.name} · ${word(health(s))}`); select(s.id);
  ($('#fullscreenBar').hidden ? $('#title') : $('#exitFullscreen')).focus();
});

$('#menu').onclick = () => {
  const open = !$('#rail').classList.contains('open');
  setRail(open);
  if (open) ($('#list .sel') ?? $('#navAdd')).focus();
};
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && $('#rail').classList.contains('open')) {
    setRail(false);
    $('#menu').focus();
  }
});
document.querySelector('main').addEventListener('click', event => {
  if (!event.target.closest('#menu')) setRail(false);
});
$('#theme').onclick = () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
};
if (isDetached()) document.body.dataset.detached = '';
select(isDetached() ? previewId : 'a');
</script>
</body>
</html>
